name: huwiya_sdk
description: >-
  OAuth 2.0 + PKCE authentication SDK for Flutter, backed by Huwiya ID.
  Reactive auth state, automatic token refresh, JWT claims validation.
version: 0.1.0
homepage: https://github.com/hitaqnia/huwiya-flutter
repository: https://github.com/hitaqnia/huwiya-flutter
issue_tracker: https://github.com/hitaqnia/huwiya-flutter/issues

topics:
  - oauth
  - oauth2
  - authentication
  - pkce
  - sso

environment:
  sdk: ^3.11.4
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  flutter_web_auth_2: ^4.0.0
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
